name: donut4u
description: donut4u - Tagalog social app with bot-powered fresh columns. Zero capital MVP.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  provider: ^6.1.2

  # In-app video
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Network / images
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # Time & ids
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

  # Gallery picker (images + videos)
  image_picker: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.4

  # Firebase (free Spark plan)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.6

  # Show notifications while app is in foreground
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
