name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Keep the Firebase config
        run: |
          if [ -f "android/app/google-services (2).json" ]; then
            cp "android/app/google-services (2).json" "$RUNNER_TEMP/gs.json"
          elif [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json "$RUNNER_TEMP/gs.json"
          fi

      - name: Generate the Android project (package com.donut4u.app)
        run: |
          flutter create --platforms=android --org com.donut4u --project-name app "$RUNNER_TEMP/gen"
          rm -rf android
          mv "$RUNNER_TEMP/gen/android" android
          mkdir -p assets/images assets/icons
          touch assets/images/.keep assets/icons/.keep
          if [ -f "$RUNNER_TEMP/gs.json" ]; then
            cp "$RUNNER_TEMP/gs.json" android/app/google-services.json
          fi

      - name: Patch Android files (Firebase, permissions, desugaring, lint)
        run: |
          python3 - <<'PY'
          import re, pathlib
          root = pathlib.Path('android')

          s = root / 'settings.gradle.kts'
          t = s.read_text()
          assert 'id("org.jetbrains.kotlin.android")' in t, 'settings.gradle.kts layout changed'
          t = t.replace('id("org.jetbrains.kotlin.android")',
                        'id("com.google.gms.google-services") version "4.4.2" apply false\n    id("org.jetbrains.kotlin.android")', 1)
          s.write_text(t)

          b = root / 'app' / 'build.gradle.kts'
          t = b.read_text()
          assert 'id("dev.flutter.flutter-gradle-plugin")' in t, 'app/build.gradle.kts layout changed'
          t = t.replace('id("dev.flutter.flutter-gradle-plugin")',
                        'id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")', 1)
          t = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', t)
          assert 'minSdk = 23' in t, 'minSdk not patched'
          assert 'compileOptions {' in t, 'compileOptions missing'
          t = t.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          t += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          b.write_text(t)

          r = root / 'build.gradle.kts'
          t = r.read_text()
          t += '\nsubprojects {\n    tasks.whenTaskAdded {\n        if (name.startsWith("lintVital")) {\n            enabled = false\n        }\n    }\n}\n'
          r.write_text(t)

          m = root / 'app' / 'src' / 'main' / 'AndroidManifest.xml'
          t = m.read_text()
          perms = (
              '\n    <uses-permission android:name="android.permission.INTERNET"/>'
              '\n    <uses-permission android:name="android.permission.CAMERA"/>'
              '\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          )
          t = re.sub(r'(<manifest[^>]*>)', lambda x: x.group(1) + perms, t, count=1)
          t = t.replace('android:label="app"', 'android:label="donut4u"')
          m.write_text(t)
          PY

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: donut4u-apk
          path: build/app/outputs/flutter-apk/app-release.apk
